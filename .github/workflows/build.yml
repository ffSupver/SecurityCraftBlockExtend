name: Build Mod JAR

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read mod_id and mod_version
        id: props
        run: |
          mod_id=$(grep -E '^[[:space:]]*mod_id[[:space:]]*=' gradle.properties | head -n1 | cut -d'=' -f2- | xargs)
          mod_version=$(grep -E '^[[:space:]]*mod_version[[:space:]]*=' gradle.properties | head -n1 | cut -d'=' -f2- | xargs)
          echo "mod_id=$mod_id"
          echo "mod_version=$mod_version"
          echo "mod_id=$mod_id" >> "$GITHUB_OUTPUT"
          echo "mod_version=$mod_version" >> "$GITHUB_OUTPUT"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.props.outputs.mod_id }}-${{ steps.props.outputs.mod_version }}
          path: build/libs/*.jar
          if-no-files-found: error